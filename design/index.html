<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fountainhead HR Portal</title>
<meta name="description" content="Fountainhead Group HR portal — headcount, hiring, attrition, compliance and policies across all campuses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;550;600;650;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/portal.css?v=13">
</head>
<body>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <a class="crest" href="#/overview/snapshot" aria-label="Fountainhead HR Portal home">
    <span class="crest-mark">F</span>
    <span class="crest-words">Fountainhead HR<small>Central HR · Group of Schools</small></span>
  </a>
  <nav class="top-nav" id="topNav" aria-label="Sections"></nav>
  <div class="top-right">
    <span class="fresh" id="fresh"><i class="dot"></i>Loading data…</span>
    <span class="va-label" id="viewAsLabel">View as</span>
    <div class="viewas" id="viewAs" role="radiogroup" aria-labelledby="viewAsLabel"></div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle light or dark theme" title="Light / dark">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </div>
</header>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="rail" aria-label="Report navigation">
    <div>
      <div class="rail-label">Reports</div>
      <ul class="tree" id="tree"></ul>
    </div>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <main class="main" id="main">
    <div class="main-inner" id="mainInner"></div>
  </main>
</div>

<!-- bump ?v= when assets change so browsers don't serve a stale copy -->
<script src="data/hr-data.js?v=13"></script>
<script src="assets/portal.js?v=13"></script>
</body>
</html>
